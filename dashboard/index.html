<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交通流检测系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Inter',sans-serif}

#stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}

#player{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;background:#000;display:block
}

/* corner accent lines */
.corner{position:absolute;width:20px;height:20px;pointer-events:none;opacity:.45}
.corner-tl{top:12px;left:12px;border-top:2px solid #6366f1;border-left:2px solid #6366f1}
.corner-tr{top:12px;right:12px;border-top:2px solid #6366f1;border-right:2px solid #6366f1}
.corner-bl{bottom:12px;left:12px;border-bottom:2px solid #6366f1;border-left:2px solid #6366f1}
.corner-br{bottom:12px;right:12px;border-bottom:2px solid #6366f1;border-right:2px solid #6366f1}

/* floating panels */
.panel{
  position:absolute;
  background:rgba(8,12,20,.80);
  border-radius:8px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:10px 16px;
}
.panel .lbl{font-size:10px;color:#64748b;letter-spacing:.04em;margin-bottom:2px}
.panel .val{
  font-family:'JetBrains Mono',monospace;
  font-size:36px;font-weight:900;line-height:1.05;
}

/* top-left */
#p-tl{top:20px;left:20px;border:1px solid rgba(129,140,248,.45);box-shadow:0 0 20px rgba(99,102,241,.15)}
#p-tl .sys{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#818cf8;letter-spacing:.06em}
#p-tl .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:blink 1.8s ease-in-out infinite}
#p-tl .ts{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#475569;letter-spacing:.04em}

/* top-right */
#p-tr{top:20px;right:20px;border:1px solid rgba(245,158,11,.40);box-shadow:0 0 20px rgba(245,158,11,.12);text-align:right}
#p-tr .val{color:#f59e0b;text-shadow:0 0 20px rgba(245,158,11,.5)}

/* bottom-left */
#p-bl{bottom:24px;left:20px;border:1px solid rgba(52,211,153,.40);box-shadow:0 0 20px rgba(52,211,153,.12)}
#p-bl .val-row{display:flex;align-items:baseline;gap:5px}
#p-bl .val{color:#34d399;text-shadow:0 0 20px rgba(52,211,153,.5)}
#p-bl .unit{font-size:12px;color:#475569}

/* bottom-right */
#p-br{bottom:24px;right:20px;border:1px solid rgba(96,165,250,.40);box-shadow:0 0 20px rgba(96,165,250,.12);text-align:right}
#p-br .val{color:#60a5fa;text-shadow:0 0 20px rgba(96,165,250,.5)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</head>
<body>
<div id="stage">

  <video id="player" src="/outputs/trajectory.mp4" controls preload="auto"></video>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- top-left -->
  <div class="panel" id="p-tl">
    <div class="sys">
      <span>⬡ 交通流检测系统</span>
      <div class="dot"></div>
      <span style="color:#22c55e;font-size:10px;font-weight:500">LIVE</span>
    </div>
    <div class="ts" id="ts">--:-- / --:--</div>
  </div>

  <!-- top-right -->
  <div class="panel" id="p-tr">
    <div class="lbl">累计车辆</div>
    <div class="val" id="v-vehicles">0</div>
  </div>

  <!-- bottom-left -->
  <div class="panel" id="p-bl">
    <div class="lbl">实时均速</div>
    <div class="val-row">
      <div class="val" id="v-speed">0.0</div>
      <div class="unit">km/h</div>
    </div>
  </div>

  <!-- bottom-right -->
  <div class="panel" id="p-br">
    <div class="lbl">过车事件</div>
    <div class="val" id="v-events">0</div>
  </div>

</div>
<script>
// ── 格式化 mm:ss ─────────────────────────────────
function fmt(s) {
  if (!isFinite(s)) return '--:--';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

// ── 数字缓动动画（cubic ease-out，280ms）─────────
const _prev = {};
const _rafIds = {};

function animateVal(id, target, isFloat) {
  const el = document.getElementById(id);
  if (!el) return;
  if (_rafIds[id] !== undefined) cancelAnimationFrame(_rafIds[id]);
  const from = _prev[id] ?? target;
  _prev[id] = target;
  const start = performance.now();
  (function step(now) {
    const p = Math.min((now - start) / 280, 1);
    const e = 1 - Math.pow(1 - p, 3);
    const cur = from + (target - from) * e;
    el.textContent = isFloat ? cur.toFixed(1) : Math.round(cur).toLocaleString('zh-CN');
    if (p < 1) {
      _rafIds[id] = requestAnimationFrame(step);
    } else {
      delete _rafIds[id];
    }
  })(start);
}

// ── 状态计算（以当前时间 t 为上界）──────────────
function computeStats(t, trajData, crossData) {
  // 累计车辆：trajectory 中 timestamp_s <= t 的唯一 track_id 数
  const vehicleSet = new Set();
  for (const r of trajData) {
    if (parseFloat(r.timestamp_s) <= t) vehicleSet.add(r.track_id);
  }

  // 过车事件：cross_section 中 timestamp_s <= t 的行数
  let events = 0;
  for (const r of crossData) {
    if (parseFloat(r.timestamp_s) <= t) events++;
  }

  // 实时均速：从末尾反向迭代，取最近 20 条有效速度
  const last20 = [];
  for (let i = crossData.length - 1; i >= 0 && last20.length < 20; i--) {
    const r = crossData[i];
    if (parseFloat(r.timestamp_s) <= t) {
      const v = parseFloat(r.speed_kmh);
      if (v > 0) last20.push(v);
    }
  }
  const avgSpeed = last20.length
    ? last20.reduce((s, v) => s + v, 0) / last20.length
    : 0;

  return { vehicles: vehicleSet.size, events, avgSpeed };
}

// ── 主入口 ────────────────────────────────────────
async function init() {
  const [trajData, crossData] = await Promise.all([
    fetch('/api/trajectory').then(r => r.json()).catch(err => { console.error('trajectory fetch failed:', err); return []; }),
    fetch('/api/cross_section').then(r => r.json()).catch(err => { console.error('cross_section fetch failed:', err); return []; })
  ]);

  const player = document.getElementById('player');

  player.addEventListener('timeupdate', () => {
    const t = player.currentTime;
    const dur = player.duration;

    // 时间戳
    document.getElementById('ts').textContent = fmt(t) + ' / ' + fmt(dur);

    // 计算并更新数字
    const { vehicles, events, avgSpeed } = computeStats(t, trajData, crossData);
    animateVal('v-vehicles', vehicles, false);
    animateVal('v-speed',    avgSpeed,  true);
    animateVal('v-events',   events,    false);
  });
}

init();
</script>
</body>
</html>
