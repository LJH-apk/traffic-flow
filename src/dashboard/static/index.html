<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交通流检测平台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="/dashboard/assets/app.css">
</head>
<body>

<main id="app">
  <!-- 顶栏 -->
  <header id="topbar" class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">⬡</span>
      <span class="topbar-title">交通流检测平台</span>
      <span class="topbar-dot live-dot"></span>
      <span class="topbar-status">LIVE</span>
    </div>
    <nav class="topbar-nav" id="topbarNav">
      <button class="nav-btn active" data-route="demo">演示模式</button>
      <button class="nav-btn" data-route="live">实时检测</button>
      <button class="nav-btn" data-route="dashboard">数据看板</button>
    </nav>
    <div class="topbar-info" id="topbarInfo">
      <span class="topbar-time" id="topbarTime">--:--</span>
    </div>
  </header>

  <!-- 视图容器 -->
  <div id="viewContainer" class="view-container"></div>
</main>

<script src="/dashboard/assets/utils/format.js"></script>
<script src="/dashboard/assets/utils/animate.js"></script>
<script src="/dashboard/assets/utils/color.js"></script>
<script src="/dashboard/assets/utils/dom.js"></script>
<script src="/dashboard/assets/constants.js"></script>
<script src="/dashboard/assets/store.js"></script>
<script src="/dashboard/assets/api.js"></script>
<script src="/dashboard/assets/router.js"></script>
<script src="/dashboard/assets/components/charts.js"></script>
<script src="/dashboard/assets/components/event_list.js"></script>
<script src="/dashboard/assets/components/trajectory_canvas.js"></script>
<script src="/dashboard/assets/views/demo.js"></script>
<script src="/dashboard/assets/views/live.js"></script>
<script src="/dashboard/assets/views/dashboard.js"></script>
<script src="/dashboard/assets/main.js"></script>
</body>
</html>
