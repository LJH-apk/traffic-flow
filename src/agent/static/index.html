<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交通流 AI 分析决策系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="stylesheet" href="/assets/agent.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <path d="M15 3v24" stroke="rgba(96,165,250,.55)" stroke-width="4" stroke-linecap="round"/>
      <path d="M15 15h12" stroke="rgba(96,165,250,.55)" stroke-width="4" stroke-linecap="round"/>
      <path d="M15 6v18M18 15h8" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2.5 3.2"/>
      <circle cx="15" cy="15" r="3.4" fill="#22d3ee"/>
      <circle cx="15" cy="15" r="6.5" stroke="rgba(34,211,238,.4)" stroke-width="1"/>
    </svg>
    <div>
      <div class="brand-title">交通流 AI 分析决策系统</div>
      <div class="brand-sub">TRAFFIC ANALYST AGENT</div>
    </div>
  </div>
  <div class="top-right">
    <button class="dbtn" id="btnReset" title="清空会话历史">新会话</button>
    <div class="chip"><span class="dot" id="modelDot"></span><span id="modelName">…</span></div>
    <div class="chip" id="dataChip">数据检查中…</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<div class="layout">
  <!-- ══ 左侧：KPI 数据概览 ══ -->
  <aside class="sidebar">
    <div class="card">
      <div class="card-label">观测时段 <b>SESSION</b></div>
      <div class="session-line" id="sessionLine">
        早高峰 <strong>07:59 – 08:15</strong>（15 min）<br>
        丁字路口 · 三进口 4K 监控 · 10 车道
      </div>
    </div>

    <div class="card">
      <div class="card-label">核心指标 <b>KPI</b></div>
      <div class="kpi-grid" id="kpiGrid"></div>
    </div>

    <div class="card">
      <div class="card-label">车型构成 <b>CLASS</b></div>
      <div id="classBars"></div>
    </div>

    <div class="card">
      <div class="card-label">进口分布 <b>ENTRANCE</b></div>
      <div id="entranceBars"></div>
    </div>

    <div class="card">
      <div class="card-label">数据质量 <b>QC</b></div>
      <div class="quality-note" id="qcNote">加载中…</div>
    </div>

    <button class="btn-report" id="btnReport">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 1.5h6.5L12.5 4.5v9a1 1 0 0 1-1 1h-8.5a1 1 0 0 1-1-1v-11a1 1 0 0 1 1-1z" stroke="#bff3fc" stroke-width="1.2"/><path d="M5 8h5M5 10.5h3.5" stroke="#bff3fc" stroke-width="1.2" stroke-linecap="round"/></svg>
      生成完整分析报告
    </button>
  </aside>

  <!-- ══ 中间：对话区 ══ -->
  <main class="chat">
    <div class="chat-scroll" id="scroll">
      <div class="chat-inner" id="thread">
        <div class="hero" id="hero">
          <svg class="hero-mark" viewBox="0 0 74 74" fill="none">
            <path d="M37 8v58" stroke="rgba(96,165,250,.5)" stroke-width="9" stroke-linecap="round"/>
            <path d="M37 37h29" stroke="rgba(96,165,250,.5)" stroke-width="9" stroke-linecap="round"/>
            <path d="M37 14v46M44 37h20" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 5"/>
            <circle cx="37" cy="37" r="7" fill="#22d3ee"/>
            <circle cx="37" cy="37" r="14" stroke="rgba(34,211,238,.45)" stroke-width="1.2"/>
            <circle cx="37" cy="37" r="21" stroke="rgba(34,211,238,.18)" stroke-width="1"/>
          </svg>
          <h1>让路口数据直接给出工程判断</h1>
          <p id="heroText">正在连接数据服务…</p>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="quick-chips" id="quickChips"></div>
        <div class="composer-shell">
          <div class="input-box">
            <textarea id="input" rows="1" placeholder="输入交通运行、信号配时或数据质量问题"></textarea>
          </div>
          <div class="composer-tools">
            <div class="tool-right">
              <div class="context-wrap">
                <button class="context-meter" id="contextMeter" type="button" aria-label="上下文窗口用量">
                  <span id="contextMeterText">0%</span>
                </button>
                <div class="context-popover" id="contextPopover">
                  <div class="context-pop-title">上下文窗口</div>
                  <div class="context-pop-line"><span>已用</span><b id="contextUsed">0</b></div>
                  <div class="context-pop-line"><span>上限</span><b id="contextLimit">64k</b></div>
                  <div class="context-pop-line"><span>占比</span><b id="contextRatio">0%</b></div>
                  <div class="context-pop-bar"><span id="contextBar"></span></div>
                </div>
              </div>
              <div class="setting-menu" data-setting="combined">
                <select id="modelSelect" class="setting-native" aria-hidden="true" tabindex="-1"></select>
                <select id="thinkingSelect" class="setting-native" aria-hidden="true" tabindex="-1"></select>
                <button class="setting-pill" id="settingsPill" type="button" title="切换模型和思考强度">
                  <span class="setting-bolt">⌁</span>
                  <span class="setting-value" id="settingsPillValue">…</span>
                  <span class="setting-caret">⌄</span>
                </button>
                <div class="setting-popover" id="settingsMenu" role="menu" aria-label="模型和思考强度"></div>
              </div>
              <button class="btn-send" id="btnSend" title="发送">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 15V3M4.5 7.5L9 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="hint"><span>Enter 发送 · Shift+Enter 换行</span><span id="hintRight">DeepSeek 函数调用 · 多类分析工具 · 领域知识库</span></div>
      </div>
    </div>
  </main>
</div>

<!-- ══ 报告抽屉 ══ -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">交通运行分析与优化建议报告</div>
    <div class="drawer-status" id="drawerStatus"></div>
    <div class="drawer-actions">
      <button class="dbtn" id="btnDownload" disabled>
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v7.5M3.5 6l3 3 3-3M1.5 11.5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        下载 .md
      </button>
      <button class="dbtn" id="btnClose">关闭</button>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="/assets/agent.js"></script>
</body>
</html>
